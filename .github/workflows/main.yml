name: Playwright Tests

on:
  push:
    branches: [main]          # pipeline triggers ONLY on push to main branch

jobs:
  test:
    runs-on: ubuntu-latest    # GitHub runs this on a Linux machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4       # pulls your code into the runner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'            # installs Node.js version 18

      - name: Install dependencies
        run: npm ci                     # installs packages from package.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps   # installs Chrome/Firefox on runner

      - name: Run Playwright tests
        env:
          USERNAME: ${{ secrets.USERNAME }}   # passes GitHub secret to script
          PASSWORD: ${{ secrets.PASSWORD }}   # passes GitHub secret to script
        run: npx playwright test              # executes all tests in /tests folder

      - name: Upload test results to GitHub
        uses: actions/upload-artifact@v4
        if: always()                          # uploads report even if tests fail
        with:
          name: playwright-report
          path: playwright-report/            # uploads the HTML report as artifact
